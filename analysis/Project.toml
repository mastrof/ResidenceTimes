# Plotting-only dependencies. Part of the root workspace (shared Manifest.toml), so the
# cluster can use the root project alone and never load Makie. Plot scripts add this
# folder to LOAD_PATH (see `push!(LOAD_PATH, projectdir("analysis"))`).
[deps]
CairoMakie = "13f3f980-e62b-5c42-98c6-ff1f3baf88f0"
Colors = "5ae59095-9a9b-59fe-a467-6f913c188581"
GLMakie = "e9467ef8-e4e7-5192-8a1a-b1aee30e663a"
LaTeXStrings = "b964fa9f-0449-5b57-a5c2-d3ea65f4040f"
